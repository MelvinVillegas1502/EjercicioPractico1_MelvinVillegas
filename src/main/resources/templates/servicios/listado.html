<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clases - Gimnasio Fitness</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragments/plantilla :: header}"></header>
<nav th:replace="~{fragments/plantilla :: navbar}"></nav>

<main class="contenedor">
    <h2 class="titulo">Clases de Entrenamiento</h2>

    <a class="btn" th:href="@{/servicios/nuevo}">Agregar clase</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Clase</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Editar</th>
                <th>Eliminar</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="servicio : ${servicios}">
                <td th:text="${servicio.id}"></td>
                <td th:text="${servicio.nombre}"></td>
                <td th:text="${servicio.precio}"></td>
                <td th:text="${servicio.categoria.nombre}"></td>

                <td>
                    <a class="btn btn-secundario"
                       th:href="@{/servicios/editar/{id}(id=${servicio.id})}">
                        Editar
                    </a>
                </td>

                <td>
                    <a class="btn btn-eliminar"
                       th:href="@{/servicios/eliminar/{id}(id=${servicio.id})}">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/plantilla :: footer}"></footer>

</body>
</html>
